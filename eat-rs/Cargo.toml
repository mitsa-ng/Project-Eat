[workspace]
resolver = "2"
members = ["crates/eat-core", "crates/eat-pdf", "crates/eat-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
strip = true
