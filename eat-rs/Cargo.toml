[workspace]
resolver = "2"
members = ["crates/eat-core", "crates/eat-pdf", "crates/eat-ocr", "crates/eat-app", "crates/eat-cli", "crates/eat-gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
ort = "2.0.0-rc.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
lto = false
strip = true
